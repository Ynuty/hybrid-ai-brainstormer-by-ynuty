services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.main
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env.main
    environment:
      BACKEND_URL: http://api:8000
    volumes:
      - .:/app
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
